<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>a little something, for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --plum-deep:#241423;
    --plum-mid:#3a2039;
    --mauve:#8a5570;
    --gold:#f2b84b;
    --coral:#ff6f81;
    --blush:#ffb8c6;
    --rose:#d94f70;
    --dawn-1:#ffe8d6;
    --dawn-2:#ffd1cf;
    --cream:#fff7f0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#100910;
    font-family:'Jost',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    color:#fff;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    position:relative;
    width:100%;
    max-width:460px;
    height:100vh;
    max-height:860px;
    overflow:hidden;
    background:var(--plum-deep);
  }
  @media (min-width:520px){
    .app{
      height:860px;
      border-radius:28px;
      box-shadow:0 40px 90px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    }
  }

  /* ---------- STAGE 1 : dusk / slingshot ---------- */
  #stage1{
    position:absolute;
    inset:0;
    background:radial-gradient(120% 70% at 50% 15%, #4a2a49 0%, var(--plum-deep) 55%, #180d18 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:48px 24px 40px;
    transition:opacity 0.5s ease;
  }
  #stage1.hide{opacity:0;pointer-events:none;}

  .stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0.5;animation:twinkle 3.5s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:0.15;}50%{opacity:0.8;}}

  .headline{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:500;
    font-size:19px;
    letter-spacing:0.02em;
    color:#f3dce6;
    text-align:center;
    z-index:2;
  }

  #slingSvg{
    width:100%;
    max-width:320px;
    height:auto;
    touch-action:none;
    z-index:2;
  }

  .instruction{
    font-size:12px;
    letter-spacing:0.14em;
    color:#c9a8bd;
    text-align:center;
    z-index:2;
    animation:pulseText 2.6s ease-in-out infinite;
  }
  @keyframes pulseText{0%,100%{opacity:0.55;}50%{opacity:1;}}

  #pullHeart{cursor:grab;}
  #pullHeart:active{cursor:grabbing;}

  /* ---------- FLASH ---------- */
  #flash{
    position:absolute;inset:0;background:#fff6ec;opacity:0;
    pointer-events:none;z-index:10;
  }

  /* ---------- STAGE 2 : dawn / bloom ---------- */
  #stage2{
    position:absolute;inset:0;
    background:radial-gradient(120% 80% at 50% 10%, var(--dawn-1) 0%, var(--dawn-2) 60%, #ffc9c9 100%);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 28px;
    text-align:center;
  }
  #stage2.show{display:flex;}

  #treeSvg{width:100%;max-width:300px;height:auto;}

  .bloom{opacity:0;transform:scale(0.2);transform-origin:center;transition:opacity 0.5s ease, transform 0.5s cubic-bezier(.34,1.56,.64,1);}
  .bloom.show{opacity:1;transform:scale(1);}

  #trunkPath{
    stroke-dasharray:280;
    stroke-dashoffset:280;
    transition:stroke-dashoffset 1.1s cubic-bezier(.65,0,.35,1);
  }
  #trunkPath.grow{stroke-dashoffset:0;}

  .eyebrow{
    font-size:12px;
    font-style:italic;
    letter-spacing:0.04em;
    color:#a8586e;
    opacity:0;
    transform:translateY(6px);
    transition:opacity 0.7s ease, transform 0.7s ease;
    margin-top:6px;
  }
  h1.reveal{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:44px;
    line-height:1;
    color:#b5304f;
    margin:6px 0;
    opacity:0;
    transform:translateY(10px);
    transition:opacity 0.8s ease, transform 0.8s ease;
  }
  .sub{
    font-size:13px;
    color:#8a4a58;
    max-width:260px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity 0.8s ease, transform 0.8s ease;
  }
  .eyebrow.in,h1.reveal.in,.sub.in{opacity:1;transform:translateY(0);}

  .again{
    margin-top:26px;
    font-size:11px;
    letter-spacing:0.1em;
    color:#b5304f;
    background:none;border:none;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    opacity:0;
    transition:opacity 0.8s ease;
    font-family:'Jost',sans-serif;
  }
  .again.in{opacity:0.7;}

  .petal{
    position:absolute;
    bottom:-20px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    animation:rise 6s linear infinite;
  }
  @keyframes rise{
    0%{opacity:0;transform:translateY(0) translateX(0) rotate(0deg);}
    10%{opacity:0.9;}
    90%{opacity:0.7;}
    100%{opacity:0;transform:translateY(-520px) translateX(var(--drift)) rotate(200deg);}
  }
</style>
</head>
<body>
<div class="app">

  <!-- STAGE 1 -->
  <div id="stage1">
    <div class="stars" id="stars"></div>
    <div class="headline" id="headline">a little something, for you</div>

    <svg id="slingSvg" viewBox="0 0 300 320">
      <defs>
        <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffd77a"/>
          <stop offset="100%" stop-color="#ff6f81"/>
        </linearGradient>
      </defs>

      <!-- decorative wishbone stand -->
      <path d="M150,300 C150,250 150,235 150,215" stroke="var(--mauve)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
      <path id="branchLeft" d="M150,215 C140,190 112,175 100,140" stroke="var(--mauve)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
      <path id="branchRight" d="M150,215 C160,190 188,175 200,140" stroke="var(--mauve)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
      <circle cx="100" cy="140" r="4.5" fill="var(--gold)"/>
      <circle cx="200" cy="140" r="4.5" fill="var(--gold)"/>

      <!-- elastic bands -->
      <line id="bandLeft" x1="100" y1="140" x2="150" y2="205" stroke="var(--gold)" stroke-width="2.5" opacity="0.85"/>
      <line id="bandRight" x1="200" y1="140" x2="150" y2="205" stroke="var(--gold)" stroke-width="2.5" opacity="0.85"/>

      <!-- draggable heart projectile -->
      <g id="pullHeart" transform="translate(150,205)">
        <circle r="22" fill="var(--gold)" opacity="0.12"/>
        <g transform="translate(-13,-14) scale(1.1)">
          <path d="M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z" fill="url(#heartGrad)"/>
        </g>
      </g>
    </svg>

    <div class="instruction" id="instruction">PULL &amp; RELEASE</div>
  </div>

  <div id="flash"></div>

  <!-- STAGE 2 -->
  <div id="stage2">
    <svg id="treeSvg" viewBox="0 0 300 400">
      <path id="trunkPath" d="M150,400 C150,345 138,320 150,285 C162,250 142,215 150,180"
            stroke="#7a4a3d" stroke-width="6" stroke-linecap="round" fill="none"/>
      <g id="canopy"></g>
    </svg>
    <div class="eyebrow" id="eyebrow">&hellip; ❤️</div>
    <h1 class="reveal" id="headlineReveal">Happy Birthday Basbosa</h1>
    <div class="sub" id="sub">Wishing you peaceful and safe years ahead</div>
    <button class="again" id="again">pull it back again</button>
    <div id="petals"></div>
  </div>

</div>

<script>
(function(){
  // ---- personalize via ?name=&msg= in the URL, defaults otherwise ----
  const params = new URLSearchParams(location.search);
  const name = params.get('name');
  const customMsg = params.get('msg');
  if(name){
    document.getElementById('headline').textContent = 'a little something, for ' + name;
  }
  if(customMsg){
    document.getElementById('sub').textContent = customMsg;
  } else if(name){
    document.getElementById('sub').textContent = "here's to a year that blooms, " + name;
  }

  // ---- scattered stars ----
  const starsWrap = document.getElementById('stars');
  for(let i=0;i<40;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*70 + '%';
    s.style.animationDelay = (Math.random()*3.5) + 's';
    starsWrap.appendChild(s);
  }

  // ---- slingshot drag physics ----
  const svg = document.getElementById('slingSvg');
  const pullHeart = document.getElementById('pullHeart');
  const bandLeft = document.getElementById('bandLeft');
  const bandRight = document.getElementById('bandRight');
  const leftAnchor = {x:100,y:140};
  const rightAnchor = {x:200,y:140};
  const rest = {x:150,y:205};
  const maxRadius = 95;
  const releaseThreshold = 26;
  let dragging = false;
  let pos = {...rest};
  let launched = false;
  const pt = svg.createSVGPoint();

  function toSvgCoords(clientX, clientY){
    pt.x = clientX; pt.y = clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function render(){
    pullHeart.setAttribute('transform', `translate(${pos.x},${pos.y})`);
    bandLeft.setAttribute('x2', pos.x); bandLeft.setAttribute('y2', pos.y);
    bandRight.setAttribute('x2', pos.x); bandRight.setAttribute('y2', pos.y);
  }

  function onDown(e){
    if(launched) return;
    dragging = true;
    pullHeart.style.transition = 'none';
    pullHeart.setPointerCapture && e.pointerId!=null && pullHeart.setPointerCapture(e.pointerId);
  }

  function onMove(e){
    if(!dragging) return;
    const c = toSvgCoords(e.clientX, e.clientY);
    let dx = c.x - rest.x, dy = c.y - rest.y;
    const dist = Math.hypot(dx,dy);
    if(dist > maxRadius){
      const s = maxRadius/dist;
      dx *= s; dy *= s;
    }
    pos = {x:rest.x+dx, y:rest.y+dy};
    render();
  }

  function onUp(){
    if(!dragging) return;
    dragging = false;
    const dist = Math.hypot(pos.x-rest.x, pos.y-rest.y);
    if(dist > releaseThreshold){
      launch();
    } else {
      springBack();
    }
  }

  function springBack(){
    pullHeart.style.transition = 'transform 0.45s cubic-bezier(.34,1.56,.64,1)';
    bandLeft.style.transition = 'all 0.45s cubic-bezier(.34,1.56,.64,1)';
    bandRight.style.transition = 'all 0.45s cubic-bezier(.34,1.56,.64,1)';
    pos = {...rest};
    render();
  }

  function launch(){
    launched = true;
    document.getElementById('instruction').style.opacity = '0';
    let dx = rest.x - pos.x, dy = rest.y - pos.y;
    const mag = Math.hypot(dx,dy) || 1;
    dx/=mag; dy/=mag;
    const target = {x: rest.x + dx*900, y: rest.y + dy*900};

    pullHeart.style.transition = 'transform 0.55s cubic-bezier(.55,0,.85,.35)';
    bandLeft.style.transition = 'opacity 0.2s ease';
    bandRight.style.transition = 'opacity 0.2s ease';
    bandLeft.style.opacity = '0';
    bandRight.style.opacity = '0';

    pos = target;
    pullHeart.setAttribute('transform', `translate(${pos.x},${pos.y}) scale(0.4)`);

    setTimeout(()=>{
      flashAndReveal();
    }, 480);
  }

  svg.addEventListener('pointerdown', function(e){
    // only start drag if pointer is reasonably near the heart
    const c = toSvgCoords(e.clientX, e.clientY);
    if(Math.hypot(c.x-pos.x, c.y-pos.y) < 40){ onDown(e); }
  });
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);

  // ---- flash + reveal ----
  function flashAndReveal(){
    const flash = document.getElementById('flash');
    flash.style.transition = 'opacity 0.28s ease';
    flash.style.opacity = '1';
    setTimeout(()=>{
      document.getElementById('stage1').classList.add('hide');
      buildCanopy();
      document.getElementById('stage2').classList.add('show');
      requestAnimationFrame(()=>{
        document.getElementById('trunkPath').classList.add('grow');
      });
      setTimeout(revealBlooms, 550);
      setTimeout(revealText, 1050);
      setTimeout(spawnPetals, 1200);

      flash.style.transition = 'opacity 0.6s ease';
      flash.style.opacity = '0';
    }, 260);
  }

  function heartPoint(t, scale, cx, cy){
    const x = 16*Math.pow(Math.sin(t),3);
    const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    return { x: cx + x*scale, y: cy - y*scale };
  }

  function buildCanopy(){
    const canopy = document.getElementById('canopy');
    if(canopy.childElementCount) return; // build once
    const colors = ['#ff6f81','#ffb8c6','#f6b93b','#d94f70','#ffd6a5'];
    const cx = 150, cy = 150;
    let idx = 0;
    // two layered rings for fullness
    [1, 0.62].forEach((scaleMul, ring)=>{
      const count = ring===0 ? 34 : 20;
      for(let i=0;i<count;i++){
        const t = (i/count) * Math.PI*2 + (ring*0.15);
        const jitter = (Math.random()-0.5)*8;
        const base = heartPoint(t, 6.4*scaleMul, cx, cy);
        const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
        c.setAttribute('cx', base.x + jitter);
        c.setAttribute('cy', base.y + jitter*0.6);
        c.setAttribute('r', (ring===0 ? 6+Math.random()*4 : 4+Math.random()*3));
        c.setAttribute('fill', colors[idx % colors.length]);
        c.classList.add('bloom');
        c.style.transitionDelay = (idx*18) + 'ms';
        canopy.appendChild(c);
        idx++;
      }
    });
  }

  function revealBlooms(){
    document.querySelectorAll('.bloom').forEach(el=>el.classList.add('show'));
  }
  function revealText(){
    document.getElementById('eyebrow').classList.add('in');
    document.getElementById('headlineReveal').classList.add('in');
    document.getElementById('sub').classList.add('in');
    document.getElementById('again').classList.add('in');
  }

  function spawnPetals(){
    const wrap = document.getElementById('petals');
    for(let i=0;i<10;i++){
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = Math.random()>0.5 ? '❤' : '✿';
      p.style.left = (5+Math.random()*90) + '%';
      p.style.setProperty('--drift', (Math.random()*60-30)+'px');
      p.style.animationDelay = (Math.random()*5) + 's';
      p.style.color = Math.random()>0.5 ? '#ff6f81' : '#f6b93b';
      wrap.appendChild(p);
    }
  }

  // ---- replay ----
  document.getElementById('again').addEventListener('click', function(){
    document.getElementById('stage2').classList.remove('show');
    document.getElementById('stage1').classList.remove('hide');
    document.getElementById('trunkPath').classList.remove('grow');
    document.querySelectorAll('.bloom').forEach(el=>el.classList.remove('show'));
    document.getElementById('canopy').innerHTML = '';
    document.getElementById('eyebrow').classList.remove('in');
    document.getElementById('headlineReveal').classList.remove('in');
    document.getElementById('sub').classList.remove('in');
    document.getElementById('again').classList.remove('in');
    document.getElementById('petals').innerHTML = '';
    document.getElementById('instruction').style.opacity = '';
    launched = false;
    pos = {...rest};
    pullHeart.style.transition = 'none';
    bandLeft.style.transition = 'none';
    bandRight.style.transition = 'none';
    bandLeft.style.opacity = '0.85';
    bandRight.style.opacity = '0.85';
    render();
  });

})();
</script>
</body>
</html>
